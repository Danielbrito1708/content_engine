# Every service carries these. The stack is meant to run unattended on one
# machine, and without them two things happen on their own: a container that
# crashes (or a host that reboots) stays down until somebody notices, and the
# json-file log grows without bound until it takes the disk with it.
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── Infrastructure ──────────────────────────────────────────────
  db:
    <<: *runtime
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blender_worker
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql

  minio:
    <<: *runtime
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Services ─────────────────────────────────────────────────────
  blender_worker:
    <<: *runtime
    build: ./blender_worker
    # Counterintuitive, but this is protection. Unbounded, a render that eats the
    # machine gets *some* process killed by the kernel, and if that process is
    # Postgres the state of every run goes with it. Bounded, the render itself is
    # what dies: the job is marked failed, with the reason, and orphan recovery
    # picks it up. Trading a catastrophic failure for a recoverable one is the
    # whole point. 3g is roughly twice the estimated cost of one 1080x1920 render
    # — measure a real one and tighten it.
    mem_limit: 3g
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      ROOT_DIR: /app
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/blender_worker
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  orchestrator:
    <<: *runtime
    build: ./orchestrator
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ROOT_DIR: /app
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/orchestrator
      # As notificações mostram o horário agendado de cada publicação. Sem TZ o
      # container roda em UTC e o horário sai 3h adiantado — errado de um jeito
      # que parece certo, que é o pior tipo de erro numa mensagem de alerta.
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  llm_service:
    <<: *runtime
    build: ./llm_service
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      ROOT_DIR: /app

  tts_service:
    <<: *runtime
    build: ./tts_service
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      ROOT_DIR: /app
    volumes:
      # The Whisper weights (~420 MB) are downloaded on first use, into the
      # container's writable layer. Without this volume every recreate downloads
      # them again — and a restart while HuggingFace is unreachable leaves the
      # service unable to transcribe at all.
      - whisper_cache:/root/.cache/huggingface

  tiktok_poster:
    <<: *runtime
    build: ./tiktok_poster
    ports:
      - "8004:8000"
    env_file:
      - .env
    environment:
      ROOT_DIR: /app

  content_scout:
    <<: *runtime
    build: ./content_scout
    ports:
      - "8005:8000"
    env_file:
      - .env
    environment:
      ROOT_DIR: /app
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/content_scout
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  whisper_cache:
