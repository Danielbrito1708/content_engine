services:
  # ── Infrastructure ──────────────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blender_worker
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Services ─────────────────────────────────────────────────────
  blender_worker:
    build: ./blender_worker
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      ROOT_DIR: /app
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/blender_worker
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ROOT_DIR: /app
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/orchestrator
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  llm_service:
    build: ./llm_service
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      ROOT_DIR: /app

  # tts_service:
  #   build: ./tts_service
  #   ports:
  #     - "8003:8000"
  #   env_file:
  #     - .env

  # tiktok_poster:
  #   build: ./tiktok_poster
  #   ports:
  #     - "8004:8000"
  #   env_file:
  #     - .env

volumes:
  postgres_data:
  minio_data:
