[app]
name = blender_worker

[log]
log_level = INFO
log_dir = logs
log_max_bytes = 10485760
log_backup_count = 5
log_file = app.log

show_locals = True
rich_tracebacks = True

[blender]
bin = /usr/local/bin/blender
# How many Blender processes may run at once. `POST /jobs` hands every job to
# BackgroundTasks, which imposes no limit of its own: N accepted jobs meant N
# Blender processes competing for the same RAM. On the 8 GB target that is an OOM
# kill whose victim the kernel picks — and losing Postgres (the state of every
# run) is far worse than delaying a render. Jobs past the limit wait as `pending`
# instead of being refused; the orchestrator polls, so waiting costs nothing.
max_concurrent_renders = 1
# ffprobe reads real asset duration for the declarative-timeline preview routes
# (POST /timelines/preview/frame|clip) — assumes PATH, unlike `bin` above, because
# `apt-get install ffmpeg` already puts it there.
ffprobe_bin = ffprobe
# Separate from max_concurrent_renders on purpose: an interactive preview must
# never queue behind a ~12-minute production render. See timeline/preview.py.
max_concurrent_previews = 1

[storage]
bucket = blender-jobs
