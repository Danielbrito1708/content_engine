[project]
name = "blender-worker"
version = "0.1.0"
description = ""
authors = [
    {name = "Daniel",email = "danielbrito1708@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx (>=0.27,<1.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0,<3.0)",
    "asyncpg (>=0.29,<1.0)",
    "boto3 (>=1.34,<2.0)",
    "alembic (>=1.13,<2.0)",
    "pillow (>=10.1,<12.0)"
]

[tool.poetry]
packages = [{include = "blender_worker", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=0.23,<2.0)",
    "anyio[trio] (>=4.0,<5.0)",
    "fake-bpy-module (>=20260501,<20260502)",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
