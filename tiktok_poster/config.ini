[app]
name = tiktok_poster

[log]
log_level = INFO
log_dir = logs
log_max_bytes = 10485760
log_backup_count = 5
log_file = app.log
show_locals = True
rich_tracebacks = True

[posting]
posts_per_day = 3
# Horários em **UTC**, mas a janela que importa é a do público, que é o Brasil
# (UTC-3, sem horário de verão desde 2019). Estes três são 11:00, 15:00 e 19:00
# em Brasília: a janela pedida é 11h–20h, e o último slot fica uma hora antes do
# fim de propósito — parte 2 de uma série pendura `series_gap_minutes` depois da
# parte 1 e ainda cai dentro da janela.
preferred_times = 14:00,18:00,22:00
presigned_url_ttl = 21600
buffer_queue_limit = 10
# Intervalo entre as partes de uma mesma história. Só vale para partes 2+, que
# penduram no horário da anterior em vez de disputar os `preferred_times` —
# história dividida é uma história continuada, não dois posts independentes.
series_gap_minutes = 30

[hashtags]
# ⚠️ Vazio desde 28/08/2026, de propósito. Eram `#tiktokbrasil,#fyp` em **todo**
# post — 47 vídeos com as mesmas duas tags, na mesma posição, e o resto da
# legenda preenchido sempre pelo topo do pool (`#viral #foryou #foryoupage`).
# Cauda idêntica post após post é assinatura de conta automatizada, que é
# exatamente o que se quer parar de emitir. O mecanismo continua aqui: preencher
# esta linha volta a fixar tags, e o pool agora é reordenado por post.
mandatory =
max_total = 8
# Obrigatórias do YouTube. São outras porque `#tiktokbrasil` e `#fyp` não
# significam nada lá — hashtag de YouTube é busca, não distribuição.
# Note que `#shorts` NÃO está aqui: a política de divisão permite vídeo de até
# 30 minutos, e Short é só até 3. Marcar como Short um vídeo que não é engana o
# espectador e não muda a distribuição.
youtube_mandatory = #historiasreais,#reddit

[youtube]
# Vazio em BUFFER_YOUTUBE_CHANNEL_ID já desliga; este flag é o freio manual,
# para desligar sem apagar a credencial.
# ⏸️ Desligado em 27/08/2026 a pedido, até segunda ordem. A credencial do canal
# continua no `.env`: religar é voltar para `true` e reconstruir o serviço.
enabled = false
# Categoria usada quando o `content_type` da história não tem correspondência
# no YouTube (22 = People & Blogs). Ver `youtube/metadata.py`.
category_id = 22
privacy = public
made_for_kids = false
notify_subscribers = true
# A narração é voz sintética, mas o rótulo de "conteúdo alterado ou sintético"
# do YouTube mira outra coisa: fazer pessoa real parecer dizer o que não disse,
# alterar registro de evento real, ou gerar cena realista falsa. Um narrador
# genérico lendo uma história não faz nada disso — ninguém é levado a crer que
# uma pessoa específica está falando. Declarávamos por excesso de zelo.
# ⚠️ Se algum dia entrar clonagem de voz de pessoa real, isto volta para `true`.
ai_disclosed = false

[storage]
bucket = blender-jobs

[warmup]
# Rampa de aquecimento da conta default (env vars) — canal novo ou parado
# publica menos no início. Vale só para esta conta; contas extras (Fase 1 do
# multi-account) têm a própria data por canal em account_credentials,
# cadastrada via POST /accounts. Ver docs/vision.md → "Rampa de publicação" e
# docs/aquecimento.md.
#
# Data ISO (AAAA-MM-DD) de início da rampa deste canal. Vazio/ausente = canal
# com histórico, ritmo cheio — não é o estado inicial automático, é escolha
# explícita de quem liga a rampa.
tiktok_started_on =
youtube_started_on =
# Degraus: "<posts_por_dia>x<dias>", repetidos e separados por vírgula. O
# último pode vir sem "xN" — é o regime permanente, o que a rampa converge
# para e nunca deixa de valer. Palpite fundamentado (docs/aquecimento.md),
# sem medição por trás — mexa se tiver dado melhor.
steps = 1x7,2x7,3
