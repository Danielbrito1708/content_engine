[app]
name = tiktok_poster

[log]
log_level = DEBUG
log_dir = logs
log_max_bytes = 10485760
log_backup_count = 5
log_file = app.log
show_locals = True
rich_tracebacks = True

[posting]
posts_per_day = 3
preferred_times = 00:00,12:00,20:00
presigned_url_ttl = 21600
buffer_queue_limit = 10

[hashtags]
mandatory = #tiktokbrasil,#fyp
max_total = 8

[storage]
bucket = blender-jobs
