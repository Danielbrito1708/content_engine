[app]
name = orchestrator

[log]
# INFO, not DEBUG: at DEBUG every boto3 and httpx call dumps full request and
# response headers, which on a machine that runs unattended is the difference
# between a log you can read and one that fills the disk.
log_level = INFO
log_dir = logs
log_max_bytes = 10485760
log_backup_count = 5
log_file = app.log
show_locals = True
rich_tracebacks = True

[services]
llm_url = http://llm_service:8000
tts_url = http://tts_service:8000
blender_url = http://blender_worker:8000
tiktok_url = http://tiktok_poster:8000

[storage]
bucket = blender-jobs

[pipeline]
# How often to re-offer runs parked on a full Buffer queue. Buffer's free queue
# holds 10 posts and drains 3 a day, so slots open on the order of hours.
#
# ⚠️ "Checking every 15 minutes costs nothing" era falso, e custou caro. Cada
# passada gasta chamada da API do Buffer, e o plano dá **250 por dia**: a 900s,
# um único run parado consumia 96 delas — e 192 antes de BUFFER_ORG_ID existir
# no .env. A espera gastava a cota de que precisava para sair da espera.
#
# 3600s alinha a varredura ao ritmo do que ela espera: a fila abre 3 vezes por
# dia, então checar de hora em hora nunca atrasa uma vaga em mais de uma hora e
# custa 24 chamadas por run parado. Ver docs/vision.md → "A cota da API do
# Buffer é um recurso escasso".
retry_interval_seconds = 3600

[monitoring]
# Notificação de operação. As credenciais ficam no ambiente (CALLMEBOT_PHONE /
# CALLMEBOT_APIKEY, NOTIFY_WEBHOOK_URL); aqui mora só o comportamento.
enabled = true
# Corte de verbosidade: debug | info | warning | error.
#
# `debug` manda TUDO — cada parte narrada, cada render, cada agendamento. É o
# certo no começo, quando a pergunta é "o que este sistema faz quando roda
# sozinho": ela não se responde vendo só os erros. Um run de 3 partes gera ~14
# mensagens, então com 3 runs/dia são ~40.
#
# Quando o fluxo já for previsível, subir para `info` corta o miúdo (TTS, render
# de cada parte, card, gancho) e deixa os marcos — recebido, refinado, cada parte
# agendada, run concluído — mais os avisos e as falhas. `warning` deixa só o que
# está errado.
level = debug
# Segundos entre mensagens. O CallMeBot recusa rajadas, e um run produz uma:
# refino, gancho e card saem em segundos um do outro.
min_interval_seconds = 3
# Corpo do POST no NOTIFY_WEBHOOK_URL: json | text.
#
# `text` manda a mensagem crua e é o que o ntfy.sh espera — em `json` ele
# entregaria o literal {"text": "..."} na tela do celular, com chaves e aspas.
# `json` manda {"text": ...} e serve a Slack e a proxies que esperam isso.
webhook_format = text

[template]
# Clips are picked from this prefix, one per part, rotating. Empty falls back to
# background_video_key — the single fixed file every video used to share.
background_prefix = assets/backgrounds/
background_video_key = assets/background.mp4
# `assets/music.mp3` era um placeholder de 35s de silencio digital (medido: zero
# amostras nao-nulas) — todo video publicado ate aqui saiu sem trilha nenhuma.
music_key = assets/music/lofi-goularte.mp3
# Guide de layout do card de comentário da intro, resolvido pelo blender_worker
# em `templates/{card_template}.json`.
card_template = comment_default
