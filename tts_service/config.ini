[app]
name = tts_service

[log]
log_level = INFO
log_dir = logs
log_max_bytes = 10485760
log_backup_count = 5
log_file = app.log
show_locals = True
rich_tracebacks = True

[storage]
bucket = blender-jobs

[download]
# Baixa o áudio de vídeo de terceiro para virar matéria-prima do refino.
# Ver tts_service/src/tts_service/audio/download.py para o porquê de cada opção.
#
# Cliente que o handshake TLS finge ser. SEM ISTO o TikTok responde 200 com uma
# página vazia e o yt-dlp falha com "Unexpected response from webpage request",
# que parece extractor desatualizado e não é. Exige curl_cffi instalado.
impersonate = chrome
# Segunda tentativa, só quando a primeira falha: resolve os vídeos que o parser
# da página web recusa mesmo com o desafio JS resolvido ("Unable to extract
# universal data for rehydration"). Vazio desliga o fallback.
api_hostname = api16-normal-c-useast1a.tiktokv.com
# Pausa entre requisições do yt-dlp. O TikTok tem rate limit por IP: medido em
# 27/08/2026, três URLs em sequência sem pausa derrubaram as três, incluindo uma
# que tinha funcionado segundos antes. 8s passou em 2 de 3 na mesma medição.
sleep_requests = 8
retries = 4
# Teto de duração, aplicado ANTES de transcrever — é onde o custo está, a ~0.4x
# tempo real de CPU. 1800s = 30 min, o mesmo teto de fala que uma parte aguenta.
# 0 desliga.
max_duration_seconds = 1800
