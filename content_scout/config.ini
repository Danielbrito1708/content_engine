[app]
name = content_scout

[log]
log_level = INFO
log_dir = logs
log_max_bytes = 10485760
log_backup_count = 5
log_file = app.log
show_locals = True
rich_tracebacks = True

[services]
orchestrator_url = http://orchestrator:8000
llm_url = http://llm_service:8000
tts_url = http://tts_service:8000

[monitoring]
# Notificação de operação. Credenciais no ambiente (CALLMEBOT_PHONE /
# CALLMEBOT_APIKEY, NOTIFY_WEBHOOK_URL); aqui só o comportamento.
# Mesma seção do orchestrator — os dois serviços mandam para o mesmo número.
enabled = true
# debug | info | warning | error.
#
# Em `debug` sai uma mensagem por ciclo mesmo quando o ciclo não acha nada — com
# interval_seconds = 3600 são 24 mensagens/dia de "nada novo". É informação real
# no começo (é assim que se vê que o scout está de fato rodando de hora em hora),
# e é a primeira coisa a cortar depois: em `info` só aparecem as histórias
# efetivamente enviadas ao pipeline, mais avisos e falhas.
level = debug
min_interval_seconds = 3
# Corpo do POST no NOTIFY_WEBHOOK_URL: json | text.
#
# `text` manda a mensagem crua e é o que o ntfy.sh espera — em `json` ele
# entregaria o literal {"text": "..."} na tela do celular, com chaves e aspas.
# `json` manda {"text": ...} e serve a Slack e a proxies que esperam isso.
webhook_format = text

[reddit]
base_url = https://www.reddit.com
# Each extra subreddit costs one request_delay window per cycle, so only keep
# subs that actually yield. Measured live (28/07/2026), 15 posts of top/week each:
#   EuSouOBabaca  15/15 passam os filtros, mediana 1831 chars — o AITA brasileiro
#   story         13/15, mediana 1704 — historia de entretenimento, em ingles
#   stories       12/15, mediana 1587 — idem, e reposta muito de r/story
# Dropped: desabafos/relacionamentos/conselhos are real venting and advice, not
# stories written to entertain — see docs/story_quality_calibration.md.
# DesabafosBrasil was dropped earlier: answers 200, returns nothing usable.
#
# AmItheAsshole e antiwork entraram em 30/08/2026 — decisão de 27/08 registrada
# no CLAUDE.md: escalar produção exige mais oferta de roteiro do que o pt-BR
# nativo sustenta, e o concorrente já resolve isso traduzindo AITA/antiwork em
# vez de transcrever TikTok. O /refine já traduz EN→pt-BR; a nota de revolta do
# /story-quality tende a favorecer os dois — vilão claro é o modo padrão do AITA
# e do antiwork. Ainda sem medição própria — tratar como as duas primeiras,
# reavaliar depois de um ciclo com números reais em GET /scout/seen.
#
# pettyrevenge, MaliciousCompliance e EntitledPeople entraram em 07/09/2026 —
# buscando o arco "protagonista subestimado/humilhado vira o jogo e o vilão
# passa a respeitá-lo". Medido ao vivo (07/09/2026, top/mês, 25 posts cada):
# os três 25/25 com corpo real (nenhum post só-link sem texto), diferente do
# antiwork, onde a maioria dos 25 é link post de notícia sem corpo narrável.
# Não é a mesma janela de medição dos outros (top/semana) nem cobre volume
# sustentado — reavaliar depois de um ciclo real em GET /scout/seen.
# ProRevenge ficou de fora: o feed top/mês voltou vazio (sub parece
# restrito/em quarentena) — não vale a janela de rate limit por ciclo.
subreddits = EuSouOBabaca,story,stories,AmItheAsshole,antiwork,pettyrevenge,MaliciousCompliance,EntitledPeople
time_filter = week
limit_per_subreddit = 15
request_timeout = 20
# Unauthenticated feeds allow ~1 request per 40s. Back-to-back requests mean only
# the first subreddit ever answers 200; the rest 429. Measured live: 45s still
# drew a 429 with reset=12, so the window slides — 60s is the safe floor.
request_delay_seconds = 60
# Comment feed page size. 0 uses Reddit's default, which is what you want:
# measured live, ?limit=500 returned the same 121 comments as no limit at all,
# so raising it buys nothing and only makes the payload harder to cap.
comments_limit = 0
# Historical sweep: pages through a sub's all-time top so the queue is not limited
# to whatever happened this week. 0 disables it. Costs ONE extra request window on
# the cycles where a sweep is due, never more — one subreddit per cycle.
# The cadence lives in the DB (archive_cursors.last_swept_at), not a counter, so a
# restart does not trigger an immediate re-sweep.
archive_interval_hours = 6
# Which window the sweep pages through. `all` is the point of the feature; `year`
# is the sane fallback if all-time turns out to be too picked-over.
archive_time_filter = all
archive_limit = 15

[filters]
# Safety is decided per candidate by the moderation model in llm_service — see
# POST /moderate.
# The floor is a cheap pre-filter: under it there is no story, so there is
# nothing worth judging.
min_chars = 600
# There used to be a ceiling here (max_chars = 30000), dropped on 07/09/2026.
# It was derived from MAX_PART_WORDS (llm_service prompts/refine.py), the old
# 30-minute/multi-part format: a post past the ceiling would come out as a
# split series with a cliffhanger instead of one video. That mechanism no
# longer exists — the 31/08/2026 format change made the refiner always
# RECONTAR every candidate, of any length, into a single 10-40s video
# (TARGET_MIN/MAX_WORDS in refine.py; "parts" is always exactly one element).
# A post's length now only changes how much the refiner has to condense, never
# whether it can. See llm_service/CLAUDE.md — "Formato: uma história completa
# em 10-40s".

[scout]
interval_seconds = 3600
# How many pipeline runs may be in flight before the scout stops ingesting. This
# is also the ceiling on concurrent renders reaching the blender_worker, which is
# what makes it a memory knob and not just a pacing one: the 8 GB target fits
# roughly one Blender process at a time. It was 5. With 3 publications a day, 2 in
# flight keeps the queue full — the cut removes a peak, not throughput. The
# blender_worker enforces its own limit too ([blender] max_concurrent_renders);
# this one keeps the work from piling up upstream of that gate in the first place.
max_pending_runs = 2
max_per_cycle = 2
# Ceiling per publication account, on top of max_pending_runs above. Only
# consulted once GET /accounts (orchestrator) reports more than one active
# account — with a single account (today) this has no effect, by construction,
# regardless of its value. Same number as max_pending_runs today because with
# the global ceiling still at 2 this is close to a no-op; when a second
# account carries real volume, raise max_pending_runs in tandem with account
# count and use this to stop one busy account from eating the whole raised
# budget while another sits idle. See CLAUDE.md, "Escolha de conta".
max_pending_runs_per_account = 2
# Window for the round-robin tie-break (which eligible account is least
# served). Deliberately NOT "since ever": every seen_items row before this
# feature shipped has account_id = NULL (the default account), so an
# all-time count would hand every tie to a brand-new account for weeks until
# its count caught up to the default's history — starving the main account
# instead of balancing with it. 24h bounds that to about a day.
account_usage_window_hours = 24
moderation_timeout = 60
# Comment enrichment runs only on candidates about to be published, but each one
# still costs a full request_delay window — with max_per_cycle = 2 that is about
# two extra minutes per cycle. Turn off to get cycles back to fetch-only speed.
fetch_comments = true
# Bodies kept per post. The count is the signal; the bodies are a sample for
# reading reactions, not an archive of the thread.
max_comments_stored = 20
# Story quality: one batched call per cycle that scores every candidate's opening
# and orders them by it. Off means candidates keep the source's own ranking and
# carry no tag — the cycle still runs, it just selects blind.
story_quality = true
# Below this score a candidate is tagged weak_storytelling. It is a label, not a
# gate: a weak post still publishes if nothing better is available. The prompt's
# rubric puts an ordinary forum post at 4-6, so 6 flags the bottom half. Tune it
# against `GET /scout/seen` once there is real data.
min_story_score = 6
# How much of each body goes into the batch. Sending whole posts would be ~180k
# characters for one cycle and defeat the batching; the opening is also what the
# viewer actually judges.
story_excerpt_chars = 700
# Revolta. O canal vive de indignação: a história que rende é a que tem um vilão
# claro e uma injustiça de pé. O modelo devolve `outrage` (0-10) junto com a nota
# de storytelling, e a ordem do ciclo é `outrage_weight * outrage + story_score`.
#
# Peso 2 é uma escolha, não um ajuste fino: ordenar só por revolta poria uma
# história 10 de revolta e 3 de narrativa na frente de uma 9/9, e história que
# ninguém termina de assistir não rende o comentário pelo qual a revolta foi
# escolhida. Com 2, dois pontos de revolta valem mais que quatro de narrativa.
outrage_weight = 2
# Piso da revolta. É RÓTULO E CONTADOR, não portão — mesma regra do
# `min_story_score`: num ciclo sem nada revoltante, a melhor história disponível
# publica assim mesmo, porque dia sem vídeo é pior que vídeo mais calmo. Serve
# para (a) ordenar candidato não julgado no lugar neutro e (b) contar
# `low_outrage` em `GET /scout/seen` e no relatório do ciclo.
min_outrage_score = 6
# Judging ~30 openings in one call takes longer than a yes/no moderation call.
story_timeout = 120

[inbox]
# Caixa de entrada manual: link compartilhado no celular vira roteiro.
# O tópico fica em NTFY_INBOX_URL (env) — vazio desliga o laço inteiro.
#
# ATENCAO: Tem que ser um tópico DIFERENTE do NOTIFY_WEBHOOK_URL. No mesmo tópico o
# serviço leria as próprias notificações de saída e tentaria achar link nelas.
enabled = true
# Transcrição roda a ~0.4x tempo real de CPU: um vídeo de 3 min ocupa ~70s antes
# de responder. Um timeout de client padrão cortaria toda transcrição real.
transcribe_timeout = 900
# Pausa entre links da MESMA mensagem. Rate limit do TikTok é por IP, então
# mandar a parte 1 e a parte 2 juntas precisa de espaçamento entre elas.
delay_between_urls_seconds = 45
# O stream do ntfy é uma conexão longa e cai por rotina (o ntfy.sh recicla
# conexões ociosas). Reconectar é o comportamento normal, não uma falha.
reconnect_delay_seconds = 5
connect_timeout = 15
# Só depois desta quantidade de quedas seguidas é que sai aviso no celular —
# senão a reciclagem normal de conexão viraria notificação sobre nada.
failures_before_alert = 5
